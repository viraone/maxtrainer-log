<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MaxTrainer — Workout Log</title>
<style>
  :root {
    --bg: #0d0f14; --card: #171a22; --card2: #1e2230;
    --accent: #f5a623; --accent2: #ff6b35;
    --green: #4ade80; --blue: #60a5fa; --red: #f87171;
    --text: #e8eaf0; --muted: #8b90a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }
  header {
    text-align: center; padding: 28px 20px; border-radius: 20px;
    background: linear-gradient(135deg, #1a1d28 0%, #232838 100%);
    border: 1px solid #2a2f40; margin-bottom: 28px;
  }
  header h1 { font-size: 28px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin-top: 6px; font-size: 14px; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat {
    background: var(--card); border: 1px solid #2a2f40;
    border-radius: 16px; padding: 18px; text-align: center;
  }
  .stat .num { font-size: 30px; font-weight: 800; color: var(--accent); }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  .day {
    background: var(--card); border: 1px solid #2a2f40;
    border-radius: 18px; padding: 22px; margin-bottom: 18px;
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .day-head {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid #232838;
  }
  .day-head h2 { font-size: 19px; }
  .day-head .meta { color: var(--muted); font-size: 13px; }

  .exercise { margin-bottom: 14px; }
  .exercise:last-child { margin-bottom: 0; }
  .ex-name { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; }
  .set-chip {
    background: var(--card2); border: 1px solid #2f3548;
    border-radius: 10px; padding: 8px 14px; font-size: 14px;
  }
  .set-chip b { color: var(--accent); }
  .set-chip .note { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; max-width: 220px; }

  #empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    background: var(--card); border-radius: 18px; border: 1px dashed #2a2f40;
  }
  #empty .big { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💪 <span>MaxTrainer</span> Workout Log</h1>
    <p>Every set, every rep — logged automatically by Max</p>
  </header>

  <div class="stats" id="stats"></div>
  <div id="days"></div>
  <div id="empty" style="display:none">
    <div class="big">🏋️</div>
    <p>No workouts logged yet.<br/>Finish a set with the MaxTrainer app and it'll show up here!</p>
  </div>
</div>

<script>
function esc(s) {
  const d = document.createElement("div");
  d.textContent = String(s ?? "");
  return d.innerHTML;
}

async function load() {
  let data = { workouts: [] };
  try {
    const resp = await fetch("data/workouts.json?t=" + Date.now());
    if (resp.ok) data = await resp.json();
  } catch (e) { console.warn(e); }

  const workouts = data.workouts || [];
  const daysEl = document.getElementById("days");
  const statsEl = document.getElementById("stats");

  if (!workouts.length) {
    document.getElementById("empty").style.display = "block";
    return;
  }

  // Group by date
  const byDate = {};
  for (const w of workouts) {
    const date = (w.timestamp || "").slice(0, 10) || "Unknown";
    (byDate[date] ||= []).push(w);
  }
  const dates = Object.keys(byDate).sort().reverse();

  // Stats
  const totalSets = workouts.length;
  const totalReps = workouts.reduce((a, w) => a + (w.reps || 0), 0);
  const exercises = new Set(workouts.map((w) => w.exercise)).size;
  statsEl.innerHTML = `
    <div class="stat"><div class="num">${dates.length}</div><div class="label">Days trained</div></div>
    <div class="stat"><div class="num">${totalSets}</div><div class="label">Total sets</div></div>
    <div class="stat"><div class="num">${totalReps}</div><div class="label">Total reps</div></div>
    <div class="stat"><div class="num">${exercises}</div><div class="label">Exercises</div></div>`;

  // Day cards
  let html = "";
  for (const date of dates) {
    const sets = byDate[date];
    const d = new Date(date + "T12:00:00");
    const dateStr = isNaN(d) ? date : d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

    // Group sets by exercise (in order performed)
    const byEx = {};
    const order = [];
    for (const s of sets) {
      const ex = s.exercise || "Unknown";
      if (!byEx[ex]) { byEx[ex] = []; order.push(ex); }
      byEx[ex].push(s);
    }

    const dayReps = sets.reduce((a, s) => a + (s.reps || 0), 0);
    let exHtml = "";
    for (const ex of order) {
      const chips = byEx[ex].map((s, i) => {
        const note = (s.improvements && s.improvements[0]) ? `<span class="note">🔧 ${esc(s.improvements[0])}</span>` : "";
        return `<div class="set-chip">Set ${i + 1}: <b>${esc(s.reps ?? "?")} reps</b>${note}</div>`;
      }).join("");
      exHtml += `<div class="exercise"><div class="ex-name">${esc(ex)}</div><div class="sets">${chips}</div></div>`;
    }

    html += `
      <div class="day">
        <div class="day-head">
          <h2>${esc(dateStr)}</h2>
          <span class="meta">${sets.length} sets · ${dayReps} reps</span>
        </div>
        ${exHtml}
      </div>`;
  }
  daysEl.innerHTML = html;
}
load();
</script>
</body>
</html>
