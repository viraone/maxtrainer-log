name: MaxTrainer
options:
  bundleIdPrefix: com.viraone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MaxTrainer:
    type: application
    platform: iOS
    sources:
      - path: MaxTrainer
    info:
      path: MaxTrainer/Info.plist
      properties:
        CFBundleDisplayName: MaxTrainer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Max watches your form through the camera while you work out.
        NSMicrophoneUsageDescription: Max listens for your voice so you can run the workout hands-free.
        NSSpeechRecognitionUsageDescription: Max turns what you say into workout commands.
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viraone.maxtrainer
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MaxTrainer/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: true
        SWIFT_STRICT_CONCURRENCY: minimal
